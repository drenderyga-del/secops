variables:
  KICS_SCAN_TOOL: kics
  KICS_REPORT_FORMAT: json
  KICS_REPORT_FOLDER: ${APPSECHUB_RAW_REPORTS_FOLDER}/${KICS_SCAN_TOOL}
  KICS_REPORT_FILE: ${KICS_REPORT_FOLDER}/${APPSECHUB_OUTPUT_FILE}.${KICS_REPORT_FORMAT}

kics_scan:
  stage: iac-scan
  rules:
    - if: ($APPSECHUB_KICS_RAISE_FAILURE != null && $APPSECHUB_KICS_RAISE_FAILURE !~ /^(false|False|FALSE)$/) || ($APPSECHUB_RAISE_FAILURE != null && $APPSECHUB_RAISE_FAILURE !~ /^(false|False|FALSE)$/)
      when: always
      allow_failure: false
    - when: always
      allow_failure: true
  needs:
    - job: get_code_and_cloc_it
    - job: prepare_values
    - job: mr_label_checker
      optional: true
  image:
    name: $APPSECHUB_IMAGE_KICS
    entrypoint: [""]
  script:
    - |
      mkdir -p "${KICS_REPORT_FOLDER}"
      echo "Kics is scanning"
      CMD="kics scan \
      -p \"${CI_PROJECT_DIR}/${APPSECHUB_CODE_SCAN_FOLDER}\" \
      --ci \
      --ignore-on-exit results \
      --disable-secrets \
      --disable-full-descriptions \
      --exclude-type OpenAPI \
      --report-formats \"${KICS_REPORT_FORMAT}\" \
      -o \"${CI_PROJECT_DIR}/${KICS_REPORT_FOLDER}\" \
      --output-name \"${APPSECHUB_OUTPUT_FILE}.${KICS_REPORT_FORMAT}\""
      case "$APPSECHUB_DEBUG_MODE" in
        ""|"false"|"False"|"FALSE")
          ;;
        *)
          echo -e "\e[45mCommand CMD:\e[0m"
          echo "$CMD"
          echo -e "\e[45mCommand ls -al KICS_REPORT_FOLDER:\e[0m"
          ls -la ${KICS_REPORT_FOLDER}
          ;;
      esac
      sh -c "$CMD"
      echo "KICS_SCANNER_WORKDIR=${CI_PROJECT_DIR}" >> ${CI_PROJECT_DIR}/${APPSECHUB_ENV_FILE}
  artifacts:
    paths:
      - ${KICS_REPORT_FILE}
    reports:
      dotenv: ${APPSECHUB_ENV_FILE}
    expire_in: 7 days

kics_convert_results:
  extends:
    - .convert_results
  rules:
    - if: $APPSECHUB_DISABLE_PUBLISH && $APPSECHUB_DISABLE_PUBLISH !~ /^(false|False|FALSE)$/
      when: never
    - if: ($APPSECHUB_KICS_RAISE_FAILURE != null && $APPSECHUB_KICS_RAISE_FAILURE !~ /^(false|False|FALSE)$/) || ($APPSECHUB_RAISE_FAILURE != null && $APPSECHUB_RAISE_FAILURE !~ /^(false|False|FALSE)$/)
      when: always
      allow_failure: false
    - when: always
      allow_failure: true
  needs:
    - job: get_code_and_cloc_it
    - job: kics_scan
    - job: prepare_values
    - job: mr_label_checker
      optional: true
  variables:
    SCAN_FORMAT: ${KICS_SCAN_TOOL}
    SCAN_TOOL: ${KICS_SCAN_TOOL}
    CONVERT_TYPE: CODEBASE
    REPORT_FILE: ${KICS_REPORT_FILE}
    SCANNER_TEMP_DIR: ${APPSECHUB_CODE_SCAN_FOLDER}
    SCANNER_WORKDIR: ${KICS_SCANNER_WORKDIR}
    CONVERTER_WORKDIR: ${CI_PROJECT_DIR}


kics_push_results:
  extends:
    - .push_results
  rules:
    - if: $APPSECHUB_DISABLE_PUBLISH && $APPSECHUB_DISABLE_PUBLISH !~ /^(false|False|FALSE)$/
      when: never
    - if: ($APPSECHUB_KICS_RAISE_FAILURE != null && $APPSECHUB_KICS_RAISE_FAILURE !~ /^(false|False|FALSE)$/) || ($APPSECHUB_RAISE_FAILURE != null && $APPSECHUB_RAISE_FAILURE !~ /^(false|False|FALSE)$/)
      when: always
      allow_failure: false
    - when: always
      allow_failure: true
  needs:
    - job: kics_convert_results
    - job: prepare_values
    - job: mr_label_checker
      optional: true
  variables:
    SCAN_TOOL: ${KICS_SCAN_TOOL}
