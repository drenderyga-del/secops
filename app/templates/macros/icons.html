{% macro icon(name, cls='') -%}
{%- set classes = 'icon' %}
{%- if cls %}
    {%- set classes = classes ~ ' ' ~ cls %}
{%- endif %}
<svg class="{{ classes }}" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  {%- if name == 'shield' %}
  <path d="M12 3 5 6v5c0 4.28 2.99 8.33 7 9.5 4.01-1.17 7-5.22 7-9.5V6l-7-3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M9 12.5l2 2 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  {%- elif name == 'chart' %}
  <path d="M4 19h16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M8 19V9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M12 19V5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M16 19v-6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  {%- elif name == 'cube' %}
  <path d="M12 3 19 6.5V13.5L12 17 5 13.5V6.5L12 3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M12 17V10.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M19 6.5 12 10.5 5 6.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  {%- elif name == 'warning' %}
  <path d="M12 4 3 20h18L12 4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M12 9.5v4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M12 17.5h.01" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  {%- elif name == 'check-circle' %}
  <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <path d="M9 12.5l2 2 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  {%- elif name == 'x-circle' %}
  <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <path d="M9.5 9.5 14.5 14.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M14.5 9.5 9.5 14.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  {%- elif name == 'spinner' %}
  <path d="M12 4a8 8 0 1 1-5.657 13.657" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  {%- elif name == 'stop' %}
  <rect x="8" y="8" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
  {%- elif name == 'forward' %}
  <path d="M7 8v8l6-4-6-4z" fill="currentColor" stroke="none"/>
  <path d="M13 8v8l6-4-6-4z" fill="currentColor" stroke="none"/>
  {%- elif name == 'question-circle' %}
  <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <path d="M10.5 9a1.5 1.5 0 013 0c0 .8-.65 1.2-1.2 1.5-.52.27-.8.63-.8 1.25v.3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M12 16h.01" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  {%- elif name == 'search' %}
  <circle cx="11" cy="11" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <path d="M15.5 15.5 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  {%- elif name == 'rotate' %}
  <path d="M8 5H5v3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M5 8a7 7 0 107 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  {%- elif name == 'arrow-up-right' %}
  <path d="M8 8h8v8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M8 16 16 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  {%- elif name == 'arrow-left' %}
  <path d="M15 6 9 12l6 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  {%- elif name == 'arrow-right' or name == 'arrow-right-long' %}
  <path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  {%- elif name == 'thumb-up' %}
  <path d="M6 11h3.5l1-4a2 2 0 013.5-.5L15.5 8H18a1.8 1.8 0 011.75 2.25l-.75 3a2 2 0 01-1.94 1.5H13l-.5 2.5h-4a1.5 1.5 0 01-1.5-1.5V11z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  {%- elif name == 'folder' %}
  <path d="M4 8.5A1.5 1.5 0 015.5 7H10l2 2h6.5A1.5 1.5 0 0120 10.5v7A1.5 1.5 0 0118.5 19h-13A1.5 1.5 0 014 17.5v-9z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
  {%- elif name == 'gear' %}
  <path d="M11.25 4.5a1.5 1.5 0 011.5 0l.17.1a1.5 1.5 0 002.01-.56l.03-.05a1.5 1.5 0 012.06-.54l.14.08a1.5 1.5 0 01.54 2.06l-.03.05a1.5 1.5 0 00.56 2.01l.17.1a1.5 1.5 0 010 2.6l-.17.1a1.5 1.5 0 00-.56 2.01l.03.05a1.5 1.5 0 01-.54 2.06l-.14.08a1.5 1.5 0 01-2.06-.54l-.03-.05a1.5 1.5 0 00-2.01-.56l-.17.1a1.5 1.5 0 01-1.5 0l-.17-.1a1.5 1.5 0 00-2.01.56l-.03.05a1.5 1.5 0 01-2.06.54l-.14-.08a1.5 1.5 0 01-.54-2.06l.03-.05a1.5 1.5 0 00-.56-2.01l-.17-.1a1.5 1.5 0 010-2.6l.17-.1a1.5 1.5 0 00.56-2.01l-.03-.05a1.5 1.5 0 01.54-2.06l.14-.08a1.5 1.5 0 012.06.54l.03.05a1.5 1.5 0 002.01.56l.17-.1z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="12" cy="12" r="3.25" fill="none" stroke="currentColor" stroke-width="1.6"/>
  {%- elif name == 'branch' %}
  <circle cx="6" cy="5" r="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <circle cx="6" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <circle cx="18" cy="11" r="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <path d="M6 7v8a4 4 0 004 4h4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M10 11h4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  {%- elif name == 'key' %}
  <circle cx="14" cy="10" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <path d="M11 13v2h-2v2H8v2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  {%- elif name == 'layers' %}
  <path d="M12 4 4 8l8 4 8-4-8-4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M4 12l8 4 8-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M4 16l8 4 8-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
  {%- elif name == 'wrench' %}
  <path d="M15.75 5.25a4 4 0 01-5.4 5.4L5 16v3l3-3 5.35-5.35a4 4 0 002.4-5.4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M5 16l-1.5 1.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  {%- elif name == 'diagram' %}
  <circle cx="12" cy="6" r="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <circle cx="6" cy="18" r="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <circle cx="18" cy="18" r="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <path d="M12 8.2V12l-4 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M12 12l4 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  {%- elif name == 'check' %}
  <path d="M5.5 12.5 10 17l8.5-10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  {%- elif name == 'x' %}
  <path d="M6 6l12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  {%- elif name == 'plus' %}
  <path d="M12 5v14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M5 12h14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  {%- elif name == 'clock' %}
  <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <path d="M12 8v4l2.5 2.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  {%- elif name == 'box-open' %}
  <path d="M4 9.5 12 6l8 3.5-8 3.5-8-3.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M4 9.5V16l8 4 8-4V9.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
  {%- elif name == 'folder-open' %}
  <path d="M4.5 9h5.5l2 2h7a1.5 1.5 0 011.46 1.9l-1.2 4.7A1.5 1.5 0 0117.82 19H6.18a1.5 1.5 0 01-1.44-1.18L3.5 10.5A1.5 1.5 0 014.5 9z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
  {%- elif name == 'download' %}
  <path d="M12 5v10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M8 11l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M5 19h14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  {%- else %}
  <circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/>
  {%- endif %}
</svg>
{%- endmacro %}
