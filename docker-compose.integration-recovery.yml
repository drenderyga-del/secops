services:
  qa_mock:
    image: ${SECPIPE_IMAGE:?SECPIPE_IMAGE must reference a locally available ScanOps image}
    command:
      - python
      - qa/mock_server.py
      - --host
      - 0.0.0.0
      - --port
      - "18080"
    environment:
      SCANOPS_MOCK_ACCESS_LOG: "false"
    ports:
      - "127.0.0.1:${SCANOPS_MOCK_PORT:-18080}:18080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18080/healthz', timeout=2)"
      interval: 2s
      timeout: 2s
      retries: 10
    restart: "no"
